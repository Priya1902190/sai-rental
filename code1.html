<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sai Rental Collection - Availability Checker</title>

  <style>
   * {
    box-sizing: border-box;
    }

    html {
    width: 100%;
    overflow-x: hidden;
    }

    body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #fff9db;
    overflow-x: hidden;
    }

    .header-img {
    width: 100%;
    height: auto;
    min-height: 180px;
    max-height: 500px;
    display: block;
    object-fit: cover;
    }

    /* Main Container */
    .container {
    width: calc(100% - 40px);
    max-width: 500px;
    margin: -100px auto 40px;
    padding: 25px;
    background: white;
    border-radius: 10px;
    position: relative;
    z-index: 10;
    box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
    text-align: center;
    }

    /* Heading */
    h2 {
    font-size: 1.8rem;
    margin: 0 0 25px;
    }

    /* Labels */
    label {
    display: block;
    font-weight: bold;
    margin: 12px 0 6px;
    text-align: left;
    }

    /* Inputs */
    input[type="text"],
    input[type="date"] {
    width: 100%;
    height: 45px;
    padding: 10px;
    margin-bottom: 15px;
    border: 2px solid #000;
    border-radius: 4px;
    font-size: 1rem;
    }

    /* Buttons */
    button {
    max-width: 100%;
    background-color: rgb(247, 225, 182);
    padding: 10px 20px;
    border: 2px solid black;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    }

    button:hover:not(:disabled) {
    background-color: #fff158;
    }

    button:disabled {
    background-color: #d3d3d3;
    color: #777;
    border-color: #999;
    cursor: not-allowed;
    }

    /* Result */
    #result {
    width: 100%;
    margin-top: 15px;
    overflow-wrap: break-word;
    }

    .available {
    color: green;
    font-weight: bold;
    font-size: 1.1rem;
    }

    .unavailable,
    .error {
    color: red;
    font-weight: bold;
    margin-top: 15px;
    }

    /* Booking History */
    #history {
    width: 100%;
    overflow-x: auto;
    }

    /* Table */
    table {
    width: 100%;
    min-width: 420px;
    border-collapse: collapse;
    margin-top: 15px;
    font-size: 0.9rem;
    }

    th,
    td {
    border: 1px solid black;
    padding: 8px;
    text-align: center;
    white-space: nowrap;
    }

    th {
    background: #eee;
    }

    /* TABLET */

    @media (min-width: 601px) and (max-width: 1024px) {

    .header-img {
        max-height: 400px;
    }

    .container {
        width: 80%;
        max-width: 520px;
        margin-top: -80px;
    }

    }


    /* MOBILE */

    @media (max-width: 600px) {

    .header-img {
        height: auto;
        min-height: 180px;
        max-height: 250px;
        object-fit: cover;
    }

    .container {
        width: calc(100% - 24px);
        max-width: 500px;
        margin: -35px auto 25px;
        padding: 20px 16px;
        border-radius: 8px;
    }

    h2 {
        font-size: 1.5rem;
        margin-bottom: 20px;
    }

    label {
        font-size: 0.95rem;
    }

    input[type="text"],
    input[type="date"] {
        height: 44px;
        font-size: 0.95rem;
    }

    button {
        width: 100%;
        padding: 11px 15px;
        font-size: 0.95rem;
    }

    #bookDressBtn {
        margin-top: 8px;
    }

    .available,
    .unavailable {
        font-size: 1rem;
    }

    table {
        font-size: 0.78rem;
        min-width: 420px;
    }

    th,
    td {
        padding: 7px 6px;
    }
    }


    /* SMALL MOBILE */

    @media (max-width: 380px) {

    .header-img {
        min-height: 150px;
        max-height: 200px;
    }

    .container {
        width: calc(100% - 16px);
        margin-top: -25px;
        padding: 16px 12px;
    }

    h2 {
        font-size: 1.3rem;
    }

    label {
        font-size: 0.9rem;
    }

    input[type="text"],
    input[type="date"] {
        font-size: 0.9rem;
    }

    button {
        font-size: 0.9rem;
    }
    }


    /* LARGE DESKTOP */

    @media (min-width: 1200px) {

    .header-img {
        max-height: 550px;
    }

    .container {
        max-width: 500px;
        margin-top: -190px;
    }

    }
</style>
</head>

<body>

  <div class="header">
    <img src="Image/image_v4.png" alt="Sai Rental Collection Header" class="header-img">
  </div>

  <div class="container">

    <h2>Check Bookings</h2>

    <label for="dressCode">Enter Dress Code:</label>
    <input type="text" id="dressCode" placeholder="Enter code">

    <label for="pickupDate">Enter Date:</label>
    <input type="date" id="pickupDate">

    <button type="button" id="checkBtn" onclick="checkAvailability()">
      Check Availability
    </button>

    <button type="button"
            id="bookDressBtn"
            style="margin-top: 8px;"
            onclick="openBookingForm()"
            disabled>
      Book Dress
    </button>

    <div id="result"></div>
    <div id="history"></div>

  </div>

  <script>

    const BACKEND_URL =
     "https://script.google.com/macros/s/AKfycbyakQpEMAev_TvR5iu5MfeZcD5B5Ac8qDiJ0MtrDWGFla0sTWsHvEYFftzqRSjB_PvS/exec";

    const dressCodeInput = document.getElementById("dressCode");
    const pickupDateInput = document.getElementById("pickupDate");
    const resultEl = document.getElementById("result");
    const historyEl = document.getElementById("history");
    const bookDressBtn = document.getElementById("bookDressBtn");
    const checkBtn = document.getElementById("checkBtn");

    let checkedDressCode = "";
    let checkedPickupDate = "";
    let dressAvailable = false;

    async function checkAvailability() {

      const dressCode = dressCodeInput.value.trim();
      const pickupDate = pickupDateInput.value;

      resultEl.innerHTML = "";
      historyEl.innerHTML = "";

      bookDressBtn.disabled = true;
      dressAvailable = false;

      // Check empty fields
      if (!dressCode && !pickupDate) {
        resultEl.innerHTML =
          '<p class="error">⚠ Please enter Dress Code and Date.</p>';
        return;
      }

      if (!dressCode) {
        resultEl.innerHTML =
          '<p class="error">⚠ Please enter Dress Code.</p>';
        return;
      }

      if (!pickupDate) {
        resultEl.innerHTML =
          '<p class="error">⚠ Please select a Date.</p>';
        return;
      }

      resultEl.innerHTML = "<p>Checking availability...</p>";
      checkBtn.disabled = true;

      try {

        const url =
          BACKEND_URL +
          "?dressCode=" + encodeURIComponent(dressCode) +
          "&pickupDate=" + encodeURIComponent(pickupDate);

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("Server Error");
        }

        const data = await response.json();

        console.log("Backend Response:", data);


        // AVAILABLE
        if (data.status === "available") {

          dressAvailable = true;
          checkedDressCode = dressCode;
          checkedPickupDate = pickupDate;

          resultEl.innerHTML = `
            <p class="available"> Dress is Available</p>
            <p>
              Dress Code: <strong>${escapeHTML(dressCode)}</strong><br>
              Date: <strong>${formatDate(pickupDate)}</strong>
            </p>
          `;

          bookDressBtn.disabled = false;
          historyEl.innerHTML = "";

        }


        // UNAVAILABLE
        else if (data.status === "unavailable") {

          dressAvailable = false;
          bookDressBtn.disabled = true;

          resultEl.innerHTML = `
            <p class="unavailable">Dress is Unavailable</p>

            <p>
              Dress Code: <strong>${escapeHTML(dressCode)}</strong><br>
              Date: <strong>${formatDate(pickupDate)}</strong>
            </p>
          `;


          // Previous bookings
          if (Array.isArray(data.customers) && data.customers.length > 0) {

            let table = `
              <table>
                <tr>
                  <th>Customer</th>
                  <th>Pickup</th>
                  <th>Drop</th>
                  <th>Mobile</th>
                </tr>
            `;

            data.customers.forEach(function(customer) {

              table += `
                <tr>
                  <td>${escapeHTML(customer.name || "")}</td>
                  <td>${escapeHTML(customer.pickup || "")}</td>
                  <td>${escapeHTML(customer.drop || "")}</td>
                  <td>${escapeHTML(customer.mobile || "")}</td>
                </tr>
              `;

            });

            table += "</table>";

            historyEl.innerHTML = table;

          } else {

            historyEl.innerHTML =
              "<p>No booking details available.</p>";

          }

        }


        // UNKNOWN RESPONSE
        else {

        console.error("Backend Error:", data);

        resultEl.innerHTML = `
            <p class="error">
            ${escapeHTML(data.message || "Unexpected response from server.")}
            </p>
        `;

        }

      }

      catch (error) {

        console.error("Availability Error:", error);

        resultEl.innerHTML = `
          <p class="error">
            Unable to check availability.
          </p>

          <p>Please try again.</p>
        `;

      }

      finally {

        checkBtn.disabled = false;

        // Refresh page after 30 seconds
        setTimeout(function() {
          window.location.reload();
        }, 30000);

      }

    }


    // Open Booking Form
    function openBookingForm() {

      if (!dressAvailable) return;

      const bookingURL =
        "index2.html" +
        "?dressCode=" + encodeURIComponent(checkedDressCode) +
        "&pickupDate=" + encodeURIComponent(checkedPickupDate);

      window.location.href = bookingURL;
    }


    // Format Date
    function formatDate(dateString) {

      const date = new Date(dateString + "T00:00:00");

      return date.toLocaleDateString("en-IN", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });

    }


    // Security
    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // Reset when Dress Code changes
    dressCodeInput.addEventListener("input", function() {

      dressAvailable = false;
      checkedDressCode = "";
      checkedPickupDate = "";

      bookDressBtn.disabled = true;
      resultEl.innerHTML = "";
      historyEl.innerHTML = "";

    });


    // Reset when Date changes
    pickupDateInput.addEventListener("change", function() {

      dressAvailable = false;
      checkedDressCode = "";
      checkedPickupDate = "";

      bookDressBtn.disabled = true;
      resultEl.innerHTML = "";
      historyEl.innerHTML = "";

    });

  </script>

</body>
</html>
